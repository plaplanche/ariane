# Example configuration of Ariane for another Python project (ADR 0003).
# Copy this file to the root of your repository as `ariane.toml` and adapt it.

[project]
# Branch the pull requests target and the ticket branches start from.
base_branch = "main"
# Command run once in the ticket's working tree before the agent starts (list of arguments).
setup = ["uv", "sync"]
# Environment variables agents, checks and setup commands receive beyond the base set (system,
# proxy and certificate variables). An entry ending in "_" is a prefix: ["DATABASE_URL", "MYAPP_"].
# A name that looks like a secret still passes when declared, and the journal says so.
env = []
# Checks replayed at the same time, each in its own clean tree and run slot (`ARIANE_SLOT`);
# 1 (the default) replays them one by one. Only for checks that do not depend on each other.
# parallel_checks = 3
# Path globs whose change selects every check, whatever their `paths` (a change to ariane.toml
# always does): lock files, CI files.
# check_all_paths = ["uv.lock", ".github/**"]

# Optional dependency caches (ADR 0054). Each replay tree is fresh; a declared folder is stored in
# `<repo>.ariane/cache/<key>/` the first time its setup builds it, then copied into the next trees
# instead of running that setup again. The key is the SHA-256 of the `key` files' contents and of
# `setup`; change either and the folder is built again. `setup` builds that folder alone;
# `project.setup` (and a check's own `setup`) still runs after the caches, for the rest. The folder
# must be ignored by git. `keep` (default 5): entries of this path kept, the most recently used.
# Put in `key` every file `setup` reads: a file left out can change the folder, not the key.
#
# A Node project whose dependencies are in worker/:
# [[project.cache]]
# path = "worker/node_modules"
# key = ["worker/package-lock.json"]
# setup = ["npm", "ci", "--prefix", "worker"]
#
# A Python project with uv: the cache holds the dependencies only, and `project.setup`
# (["uv", "sync", "--frozen"]) then installs the project itself into the copied environment. A
# virtual environment's scripts name the tree that built it, so run tools as
# `uv run python -m pytest`, not `uv run pytest`.
# [[project.cache]]
# path = ".venv"
# key = ["uv.lock", ".python-version"]
# setup = ["uv", "sync", "--frozen", "--no-install-project"]
# keep = 3

[tracker]
# Tracker kind; only "github" exists today.
kind = "github"
# Your repository, as "owner/name".
repository = "your-account/your-repository"
# Name of the environment variable that holds the access token.
token_env = "GH_TOKEN"
# Label a person with write access puts on an issue to let Ariane run it (default "ariane").
# Ariane refuses an issue changed after the label: edit, comment or other label (ADR 0032).
ready_label = "ariane"
# Label of the queue `ariane next` reads, in the order it was added (default "ariane-next").
next_label = "ariane-next"

[agents.implementer]
# Agent runtime that runs the implementer session.
runtime = "claude-code"
# Model the session uses.
model = "claude-sonnet-5-5"
# Tools the agent may use.
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
# Spending limit of one session, in US dollars.
max_budget_usd = 5.0
# Optional: cap on the tokens of one session (input, cache and output), enforced by Ariane.
# max_tokens = 2000000
# Time limit of one session, in minutes.
timeout_minutes = 30
# Optional: stop the session when it sends no event for this many minutes (below
# timeout_minutes). Default 10, or none when timeout_minutes is 10 or less.
# idle_minutes = 10
# Optional: `ariane start <n> --resume` multiplies the limit that stopped the implementer
# session (max_budget_usd and max_tokens after a budget stop, timeout_minutes after a timeout) by
# this factor, for the resumed session only (at least 1).
# resume_factor = 2
# Optional: the highest values a resumed session gets (default: the raised value itself).
# max_budget_usd_cap = 10.0
# timeout_minutes_cap = 60

# The reviewer reads the result after the checks pass (C10). Its model must differ from the
# implementer's; give it read-only tools.
[agents.reviewer]
# runtime = "codex" runs the reviewer on Codex: a read-only `codex exec` on a ChatGPT plan
# (after `codex login`) or on an API key (api_key_env = "<variable>"); see the README.
# runtime = "opencode" runs the reviewer on opencode (see ariane.opencode-reviewer.example.toml).
# runtime = "pi" runs the reviewer on pi: model = "<provider>/<id>", tools among read, grep, find,
# ls, max_tokens required; pi's own login, or api_key_env = "<variable>"; see the README.
runtime = "claude-code"
model = "claude-opus-5-5"
tools = ["Read", "Glob", "Grep"]
max_budget_usd = 3.0
timeout_minutes = 20

# Optional: lighter settings for a small change. When the reviewed diff has at most max_lines
# changed lines (added plus deleted, without work/), these values replace the reviewer's and the
# reviewer is told not to survey the rest of the repository. The runtime and tools stay the
# reviewer's; model, if given, must still differ from the implementer's (C10). Choose your values.
# [agents.reviewer.small]
# max_lines = 40
# model = "claude-haiku-5-5"
# max_budget_usd = 1.0
# max_tokens = 400000
# timeout_minutes = 10

# Each [[checks]] entry is a check Ariane replays on the result before opening the pull request.
[[checks]]
# Name of the check, shown in the pull request statuses as ariane/<name>. "full-replay" and names
# starting with "docs: " are reserved.
name = "lint"
# Command to run (list of arguments, run from the repository root).
command = ["uv", "run", "ruff", "check", "."]

[[checks]]
name = "tests"
command = ["uv", "run", "pytest", "-q"]
# Optional: each check is replayed in its own fresh working tree, after project.setup. A "setup"
# on a check replaces project.setup in that check's tree only (what its CI job installs).
# setup = ["uv", "sync", "--only-group", "test"]
# Optional: path globs of the files whose tests this check skips when Ariane replays it (only CI runs
# them). Ariane records it, tells the implementer, and asks the reviewer to read those tests as untested.
# not_run_locally = ["tests/e2e/**"]
# Optional: path globs of the files this check covers. Ariane skips it (a `success` status saying
# so) when no changed file of the ticket matches; without `paths` (or with `always = true`) it
# always runs. Every check that runs gets ARIANE_CHANGED_FILES, the path of a file listing the
# changed files, one per line, to run only the related tests if it wants.
# paths = ["src/**", "tests/**", "pyproject.toml"]
# Every check also gets ARIANE_RISK_TIER (low or high, see [checks_policy] below) and
# ARIANE_FULL_SUITE: 1 on a high round, else 0, so that it can run only the related tests. With
# full_when = "always" the check gets ARIANE_FULL_SUITE=1 on every round (default "high").
# full_when = "always"

# Optional: what makes a round's risk tier high (ADR 0056). Without this table every round is
# high, and every check gets ARIANE_FULL_SUITE=1. A round is high when its diff has more than
# max_changed_lines added and removed lines, touches more than max_modules modules (the first path
# segment under each module_roots folder; by default the repository root), touches a
# critical_paths file, ariane.toml or a check_all_paths file, or when an earlier round of the
# ticket failed a check; it is low otherwise. A high round keeps the full review.
# When the last round skipped a check or ran one with ARIANE_FULL_SUITE=0, a full_replay_sample
# fraction of the tickets (drawn from the ticket number and the commit; 0 disables it) get a full
# replay after delivery: every check, ARIANE_FULL_SUITE=1. A check failing only there is an
# escape: a failing ariane/full-replay status and a comment on the pull request. `ariane report`
# warns when the escapes per full replay are above max_escape_rate. These defaults apply without
# the table too.
# [checks_policy]
# max_changed_lines = 300
# max_modules = 3
# module_roots = ["src/*/"]
# critical_paths = ["src/auth/**"]
# full_replay_sample = 0.2
# max_escape_rate = 0.02

# Optional: the paths the owner reviews too (ADR 0057). A change touching one is pointed out to
# the reviewer, and its pull request gets the label `owner-review` and a line, above the review,
# naming the sensitive paths changed. Nothing is merged or approved automatically.
# [review]
# sensitive_paths = ["src/auth/**", ".github/**"]

# Optional: what a change must satisfy to be done. Each item is a declared check ({ check = "name" })
# or a sentence ({ text = "..." }). The implementer receives every item. Without this table,
# the default list applies: blocking checks pass, tests cover the change, documentation updated.
[definition_of_done]
items = [
  { check = "lint" },
  { check = "tests" },
  { text = "The change is covered by tests that fail without it." },
]

# Optional: the project's documentation (C25). `paths` are the documentation files and folders.
# Each map entry says which documents cover which source files ({stem} is the file's name
# without extension); the implementer is told, and documents left untouched are flagged to the
# reviewer. Each generated entry is a command that exits non-zero when a generated document is
# stale; it runs in the replay as a blocking check named "docs: <name>".
[documentation]
paths = ["docs/", "README.md"]
map = [
  { source = "src/app/*.py", docs = ["docs/modules/{stem}.md"] },
]
generated = [
  { name = "references", check = ["python", "scripts/generate_docs.py", "--check"] },
]

# Optional: how `ariane next` reads the queue (ADR 0060). It looks at the first `look_ahead`
# issues (default 5); each label of `paths` adds globs an issue carrying it is expected to touch.
[next]
look_ahead = 5
paths = { docs = ["docs/**"] }
