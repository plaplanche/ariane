# Ariane's own configuration with the reviewer on opencode (C5): for a single run, with
# ARIANE_CONFIG=docs/ariane.opencode-reviewer.example.toml (see the README).
# Ariane's configuration for its own repository (ADR 0003).

[project]
base_branch = "main"
setup = ["uv", "sync", "--locked"]

[tracker]
kind = "github"
repository = "plaplanche/ariane"
token_env = "GH_TOKEN"

[agents.implementer]
runtime = "claude-code"
model = "claude-sonnet-5-5"
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
max_budget_usd = 5.0
timeout_minutes = 30

[agents.reviewer]
runtime = "opencode"
# <provider>/<model>; the provider's key (for example OPENAI_API_KEY) must be in the environment.
model = "openai/gpt-5"
# opencode tool names, lower case: read, glob, grep.
tools = ["read", "glob", "grep"]
max_budget_usd = 3.0
timeout_minutes = 20
# opencode does not cap its own cost: Ariane stops the session at this many tokens.
max_tokens = 400000

[[checks]]
name = "lint"
command = ["uv", "run", "ruff", "check", "."]

[[checks]]
name = "format"
command = ["uv", "run", "ruff", "format", "--check", "."]

[[checks]]
name = "types"
command = ["uv", "run", "mypy"]

[[checks]]
name = "tests"
command = ["uv", "run", "pytest", "-q"]

[[checks]]
name = "file length"
command = ["uv", "run", "python", "scripts/check_file_length.py"]

# Documentation (C25): which documents cover which files; generated ones are checked in the replay.
[documentation]
paths = ["docs/", "README.md"]
map = [
  { source = "src/ariane/*.py", docs = ["docs/architecture/modules/{stem}.md"] },
]
generated = [
  { name = "references", check = ["uv", "run", "python", "scripts/generate_docs.py", "--check"] },
]

# Definition of done (C26): given to the implementer; the reviewer answers each sentence.
[definition_of_done]
items = [
  { check = "lint" },
  { check = "format" },
  { check = "types" },
  { check = "tests" },
  { check = "file length" },
  { text = "The change is covered by tests that fail without it." },
  { text = "The documentation the change affects is updated (C25)." },
  { text = "Every choice the spec leaves open is recorded as an ADR in docs/adr/ (CLAUDE.md rule 2)." },
]
