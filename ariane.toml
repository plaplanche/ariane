# Ariane's configuration for its own repository (ADR 0003).

[project]
base_branch = "main"
setup = ["uv", "sync", "--locked"]
# Agents, checks and setup get only system, proxy and certificate variables, plus these.
env = []

[tracker]
kind = "github"
repository = "plaplanche/ariane"
token_env = "GH_TOKEN"
ready_label = "ariane"

# Opus implements, Codex reviews on the owner's ChatGPT plan (ADR 0044).
[agents.implementer]
runtime = "claude-code"
model = "claude-opus-5-5"
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
max_budget_usd = 10.0
timeout_minutes = 30

# Runs on the CLI's ChatGPT login (`codex login --device-auth`): with no api_key_env, an API-key
# login stops the ticket instead of billing per token (ADR 0043, ADR 0044).
[agents.reviewer]
runtime = "codex"
model = "gpt-6-astra"
tools = ["Read", "Glob", "Grep"]
max_budget_usd = 3.0
timeout_minutes = 20

[[checks]]
name = "lint"
command = ["uv", "run", "ruff", "check", "."]

[[checks]]
name = "format"
command = ["uv", "run", "ruff", "format", "--check", "."]

[[checks]]
name = "types"
command = ["uv", "run", "mypy"]

# Windows-only type errors (missing `os` constants, platform narrowing) seen on Linux.
[[checks]]
name = "types (Windows)"
command = ["uv", "run", "mypy", "--platform", "win32"]

[[checks]]
name = "tests"
command = ["uv", "run", "pytest", "-q"]

[[checks]]
name = "file length"
command = ["uv", "run", "python", "scripts/check_file_length.py"]

# Documentation (C25): which documents cover which files; generated ones are checked in the replay.
[documentation]
paths = ["docs/", "README.md"]
map = [
  { source = "src/ariane/*.py", docs = ["docs/architecture/modules/{stem}.md"] },
]
generated = [
  { name = "references", check = ["uv", "run", "python", "scripts/generate_docs.py", "--check"] },
]

# Changes the owner reviews too (ADR 0057): the push guard, the run registry, redaction, process
# handling and the workflows. A change touching one gets the pull request label `owner-review`.
[review]
sensitive_paths = [
  "src/ariane/git.py",
  "src/ariane/claude_code.py",
  "src/ariane/delivery.py",
  "src/ariane/runs.py",
  "src/ariane/redact.py",
  "src/ariane/process.py",
  ".github/**",
]

# Definition of done (C26): given to the implementer; the reviewer answers each sentence.
[definition_of_done]
items = [
  { check = "lint" },
  { check = "format" },
  { check = "types" },
  { check = "types (Windows)" },
  { check = "tests" },
  { check = "file length" },
  { text = "The change is covered by tests that fail without it." },
  { text = "The documentation the change affects is updated (C25)." },
  { text = "Every choice the spec leaves open is recorded as an ADR in docs/adr/ (CLAUDE.md rule 2)." },
]
